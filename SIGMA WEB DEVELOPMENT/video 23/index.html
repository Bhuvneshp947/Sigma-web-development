<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        * {
            margin: 0;
            padding: 0;
        }

        .box {
            border: 5px solid black;
            display: inline-block;
            padding: 45px;
            margin: 34px;
            width: auto;
        }

        .div{
            border: 5px solid black;
            border-radius: 8px;
            text-align:center;
            text-transform: capitalize;
        }

        .span{
            display: flex;
            justify-content: center;
            /* visibility: hidden; */
            /* display: none; */
        }
    </style>
</head>

<body>
    <div class="box">
        I'm a Box here!
    </div>
    <div class="box" >
        and also a nice box
    </div>

    <span class="span" >I am a Good</span>
    <span>Boy</span>
    <div CLASS="div" >
        IM A NEW DIV
    </div>
</body>

</html>
