<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        img{
            width: 300px;
            border-radius: 8px;
            margin: 12px;
        }

        .image1{
            position: sticky;
            top: 1px;
        }

        .image3{
            position: fixed;
        }

        .container{
            border: 2px solid black;
             height: 1900px;
             background-color: beige;
        }

        .box{
            height: 1000px;
            background-color: azure;
        }
    </style>
</head>
<body>
    <div class="container">
        <img class="image" src="image1.png"  alt="image"  >
        <img class="image1" src="image2.png"  alt="image1"  >
        <img class="image2" src="image3.png"  alt="image2"  >
        <img class="image3" src="image4.png"  alt="image3"  >
    </div>

    <div class="box"></div>
</body>
</html>
