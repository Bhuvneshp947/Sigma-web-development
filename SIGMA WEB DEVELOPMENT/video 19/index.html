<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Germania+One&display=swap');

        @import url('https://fonts.googleapis.com/css2?family=Griffy&display=swap');

        h1{
             font-family: "Germania One", system-ui;
             font-weight: 400;
             font-style: normal;
             text-decoration: underline;
             font-size: 110px;
             margin: 0;
             line-height: 1.4;
             text-align: center;
        }
        p{
            font-family: "Griffy", cursive;
            font-weight: 400;
            font-style: normal;
            text-decoration:wavy underline;
            font-size: 24px;
            margin: 0;
            line-height: 1.4;
            text-align: center;
        }
        body{
            background-color:black;
            color:white;
        }
        .unique{
            background-color: rgb(138, 138, 120);
        }
        h2{
            font-family: "Germania One", system-ui;
             font-weight: 400;
             font-style: normal;
             margin: 0;
             text-transform: capitalize;
             text-decoration: underline;
             text-decoration-color: rgb(138, 138, 120);
             text-decoration-style:dotted;
             text-decoration-thickness: 4px;
             line-height: 1.4;
             text-align: center;
        }
    </style>
</head>
<body>
    <div>
        <h1>Fonts</h1>
        <h2>Learning Different Fonts</h2>
        <p><span class="unique">"Today</span> we learn about different fonts and how to use them in our web projects."</p>
    </div>
</body>
</html>
